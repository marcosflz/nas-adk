name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev --extra tui --extra a2a --inexact
      - name: Test
        run: uv run pytest tests/ -q

  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install release tools
        run: uv sync --extra dev --inexact
      - name: Detect and bump version
        id: bump
        env:
          PYTHON: .venv/bin/python
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/ci/bump_version.sh
      - name: Build wheel and sdist
        if: steps.bump.outputs.release == 'true'
        run: uv run python -m build
      - name: Validate package
        if: steps.bump.outputs.release == 'true'
        run: uv run python -m twine check dist/*
      - name: Publish GitHub Release
        if: steps.bump.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          generate_release_notes: true
          files: dist/*
      - name: Upload package artifact
        if: steps.bump.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-v${{ steps.bump.outputs.version }}
          path: dist/*
          if-no-files-found: error
