name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev --extra tui --extra a2a --extra anthropic --inexact
      - name: Check lockfile
        run: uv lock --check
      - name: Lint
        run: uv run ruff check nas/adk/ nas/adk/tui/ tests/
      - name: Type check
        run: uv run mypy nas/adk/
      - name: Test
        run: uv run pytest tests/ -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install build tools
        run: uv sync --extra dev --inexact
      - name: Build package
        run: uv run python -m build
      - name: Validate package
        run: uv run python -m twine check dist/*
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
